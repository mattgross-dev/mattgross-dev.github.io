# =============================================================================
# Matt Gross — mattgross.com
# Quarto website project, published with GitHub Pages.
# =============================================================================

project:
  type: website
  output-dir: _site
  # After each render, inject og:url (and canonical as a fallback) into every
  # page — quarto emits no og:url on its own.
  post-render: scripts/og-canonical.js
  # Copied verbatim into _site so GitHub Pages keeps the custom domain (CNAME)
  # and crawlers can find the sitemap (robots.txt). The woff2 files in fonts/
  # are the self-hosted @font-face sources referenced by styles/site.css.
  resources:
    - CNAME
    - robots.txt
    - fonts

website:
  title: "Matt Gross"
  site-url: "https://mattgross.com"
  description: >-
    Portfolio of Matt Gross — technical product leadership, data analytics,
    and optimization. Current projects, writing, and ways to get in touch.
  open-graph:
    locale: en_US
    site-name: "Matt Gross"

  navbar:
    title: "Matt Gross"
    left:
      - href: about.qmd
        text: "About"
      - href: experience.qmd
        text: "Experience"
      - href: projects.qmd
        text: "Projects"
      - href: writing.qmd
        text: "Writing"
      - href: contact.qmd
        text: "Contact"
    tools:
      - icon: "github"
        text: "GitHub"
        href: "https://github.com/mattgross-dev"
      - icon: "rss"
        text: "RSS feed"
        href: "writing.xml"

  page-footer:
    left: "© 2026 Matt Gross"
    center: "Built with [Quarto](https://quarto.org)"
    right: "[RSS](/writing.xml) · [Privacy](/privacy.html) · [Terms](/tos.html) · [GitHub](https://github.com/mattgross-dev)"

format:
  html:
    theme:
      light: [litera, styles/custom.scss]
      dark: [slate, styles/custom-dark.scss]
    # Fonts are self-hosted: the @font-face rules at the top of
    # styles/site.css serve the woff2 files in fonts/ (copied into _site via
    # project resources), so no request is made to Google Fonts at page-view
    # time. Body/heading/code font stacks themselves come from the SCSS
    # variables in styles/custom.scss and styles/custom-dark.scss.
    css: styles/site.css
    # The site contains no math markup, so render any math as plain HTML
    # instead of pandoc's default MathJax method, which would emit a
    # <script> that loads MathJax from jsdelivr on the listing pages.
    html-math-method: plain
    # Emit <link rel="canonical"> on every page, derived from site-url.
    canonical-url: true
    toc: true
    toc-depth: 2
    anchor-sections: false
    page-navigation: true
    link-external-newwindow: true
    date-format: "MMMM D, YYYY"